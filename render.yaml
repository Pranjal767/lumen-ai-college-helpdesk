services:
  - type: web
    name: lumen-ai-helpdesk-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: EMBEDDING_MODEL
        value: synaptix-feature-hash-v3
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
